# __DOMAIN__ -> CyberGuard (Docker, 127.0.0.1:__PORT__)
# Yayın iş akışı kurar (docker/server/install-nginx.sh) ve her yayında bu şablondan yeniden
# yazar; elle değişiklik kalıcı olmaz. Kaynak: depodaki docker/server/nginx-site.conf.
# __CLOUDFLARE_...__ satırlarına docker/server/cloudflare-ips.txt'deki aralıklar yazılır.

# --- Yalnızca Cloudflare'den gelen bağlantı (sabah soruları 23) ---------------------------
# Site Cloudflare'in arkasında. Sunucunun IP'sini bilen biri Cloudflare'i atlayıp doğrudan
# gelirse Cloudflare'in korumaları (saldırı süzme, bot engeli) devreye girmez; bu girişin iki
# sunucu bloğu böyle bağlantıyı yanıt vermeden kapatır (444). Bakılan adres bağlantının kendi
# adresidir ($realip_remote_addr), CF-Connecting-IP ile yazılan ziyaretçi adresi değil.
# Sunucunun kendisi (127.0.0.1, ::1) de girebilir. Değişken adı yalnızca bu siteye aittir
# (geo bloğu nginx'in genelinde tanımlanır; sunucudaki diğer sitelere dokunmaz).
geo $realip_remote_addr $cyberguard_from_cloudflare {
    default 0;
    127.0.0.1 1;
    ::1 1;
    __CLOUDFLARE_GEO__
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    if ($cyberguard_from_cloudflare = 0) {
        return 444;
    }
    # Yalnızca HTTPS'e yönlendirir; uygulamaya istek gitmez (gerçek IP burada gerekmiyor).
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    # Cloudflare Origin sertifikası; özel anahtar sunucuda üretildi ve sunucudan çıkmaz.
    ssl_certificate /etc/nginx/ssl/__DOMAIN__/origin-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/__DOMAIN__/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($cyberguard_from_cloudflare = 0) {
        return 444;
    }

    # --- Ziyaretçinin gerçek IP'si (güvenlik turu 5, docs/security/round-5-phase-6.md) ----------
    # Site Cloudflare'in arkasında: bağlantı Cloudflare'in uç sunucusundan gelir, ziyaretçinin
    # adresi CF-Connecting-IP başlığındadır. nginx bu başlığa YALNIZCA bağlantı aşağıdaki
    # Cloudflare aralıklarından geliyorsa güvenir ve $remote_addr'ı ziyaretçinin adresi yapar.
    # Cloudflare'i atlayıp sunucunun IP'sine doğrudan gelen biri başlığı yazsa da yok sayılır;
    # onun $remote_addr'ı kendi adresidir. Uygulama adresi aşağıdaki X-Forwarded-For'dan okur
    # (lib/request.ts); istemcinin gönderdiği X-Forwarded-For hiçbir zaman geçmez.
    # Liste depoda durur (docker/server/cloudflare-ips.txt; sunucudaki başka bir sitenin ayar
    # parçasına bağlı kalmamak için) ve yukarıdaki geo bloğuyla aynıdır. Cloudflare aralık
    # eklerse orada güncellenir; eksik kalan aralıktan gelen bağlantı kesilir. Haftalık kontrol
    # (.github/workflows/cloudflare-ips.yml) farkı yakalar.
    __CLOUDFLARE_REAL_IP__
    real_ip_header CF-Connecting-IP;

    # Öğretmenlik belgesi en fazla 5 MB; form alanlarıyla birlikte 6 MB (next.config.ts bodySizeLimit).
    client_max_body_size 6m;
    # Diğer güvenlik başlıkları (CSP dahil) uygulamadan gelir (next.config.ts).
    # HSTS: bir yıl, includeSubDomains ile. includeSubDomains yalnızca bu adın altındaki adlara
    # (*.__DOMAIN__) uygulanır; muratbulut.net'e ve aynı sunucudaki diğer sitelere uygulanmaz.
    # preload yok (preload ana alan adının bütün alt alanlarını bağlardı). Gerekçe: güvenlik turu 5.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr yukarıdaki kuralla ziyaretçinin adresidir; istemcinin gönderdiği
        # X-Forwarded-For ve X-Real-IP'nin yerine yazılır (eklenmez). Uygulama CF-Connecting-IP'yi
        # ve Forwarded'ı okumaz; ileride okursa da doğrulanmış adresi görsün diye onlar da yazılır.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
